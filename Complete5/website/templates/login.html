{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <style>
    body {
      background-color: #ffe2e2; /* Light red background */
      font-family: 'Poppins', sans-serif;
      color: #212529;
    }

    h3 {
      font-weight: 700;
      color: #666666;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-weight: 500;
      color: #495057;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 12px;
      border: 1px solid #ced4da;
      font-size: 16px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input:hover {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    .form-group input:focus {
      outline: none;
      border-color: #0056b3;
      box-shadow: 0 0 10px rgba(0, 86, 179, 0.3);
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 16px;
      width: 100%;
      margin-top: 20px;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .form-footer {
      text-align: center;
      margin-top: 20px;
    }

    .form-footer a {
      color: #007bff;
    }
  </style>

  <div class="form-container">
    <h3>Login</h3>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="GA">Enter GA Number</label>
        <input
          type="text"
          id="GA"
          name="GA"
          class="form-control"
          placeholder="Enter GA Number"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Enter Password"
        />
      </div>

      <button class="btn btn-primary" type="submit">Login</button>

      <div class="form-footer">
        <p>
          <a href="{{ url_for('auth.register') }}">Don't have an account? Register</a>
        </p>
      </div>
    </form>
  </div>
{% endblock %}
