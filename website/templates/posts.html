{% extends "posts_div.html" %} {% block title %}{{username}}'s Posts{% endblock
%} {% block header %} {{GA}}'s posts {% endblock %} {% block footer %}
<style>
  body {
    background-color: #f8f9fa; /* Light gray for a clean look */
    font-family: 'Roboto', sans-serif; /* Modern font from Google Fonts */
  }

  h1 {
    color: #495057; /* Subtle dark gray */
    margin-bottom: 20px;
  }

  #posts {
    margin: 0 auto;
    max-width: 800px; /* Center posts and limit width */
  }

  .card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2); /* Highlight hover effect */
  }

  .card-header {
    background-color: #e9ecef; /* Light background for headers */
    font-weight: bold;
  }

  .card-footer {
    font-size: 0.85rem;
    background-color: #f1f3f5; /* Light footer background */
  }

  .btn-primary {
    background: linear-gradient(45deg, #007bff, #0056b3); /* Gradient for buttons */
    border: none;
  }

  .btn-primary:hover {
    background: linear-gradient(45deg, #0056b3, #003d82); /* Darker on hover */
  }

  .rounded-pill {
    border-radius: 50px;
  }

  .text-muted {
    color: #6c757d !important; /* Muted text for better readability */
  }

  @media (max-width: 768px) {
    #posts {
      padding: 0 15px;
    }
  }
</style>
<div align="center">
  <a href="/home"
    ><button type="button" class="btn btn-primary btn-lg">Back</button></a
  >
</div>
{% endblock %}
