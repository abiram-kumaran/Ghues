{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
  <style>
    body {
      background-color: #ffe2e2; /* Light pink for a soft aesthetic */
      font-family: 'Poppins', sans-serif; /* Modern font */
      color: #212529;
    }

    h3 {
      font-weight: 700;
      color: #666666; /* Matching the header color from reference */
      text-align: center;
      margin-bottom: 20px;
    }

    .form-card {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .form-card label {
      font-weight: 500;
      color: #495057;
    }

    .form-card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ced4da;
      font-size: 16px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-card input:hover {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    .form-card input:focus {
      outline: none;
      border-color: #0056b3;
      box-shadow: 0 0 10px rgba(0, 86, 179, 0.3);
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 16px;
      width: 100%;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>

  <form method="POST" class="form-card">
    <h3>Sign Up for G~Hues</h3>
    
    <div class="mb-3">
      <label for="email">Email Address</label>
      <input
        type="text"
        id="email"
        name="email"
        class="form-control"
        placeholder="Enter Email"
      />
    </div>

    <div class="mb-3">
      <label for="GA">GA Number</label>
      <input
        type="text"
        id="GA"
        name="GA"
        class="form-control"
        placeholder="Enter GA Number"
      />
    </div>

    <div class="mb-3">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        placeholder="Enter Username"
      />
    </div>

    <div class="mb-3">
      <label for="password1">Password</label>
      <input
        type="password"
        id="password1"
        name="password1"
        class="form-control"
        placeholder="Enter Password"
      />
    </div>

    <div class="mb-3">
      <label for="password2">Password Again</label>
      <input
        type="password"
        id="password2"
        name="password2"
        class="form-control"
        placeholder="Enter Password Again"
      />
    </div>

    <button class="btn btn-primary" type="submit">Sign Up</button>
  </form>
{% endblock %}
